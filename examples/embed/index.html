<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jack Orlando Reverse Engineered</title>
    <style>
      body {
        background: #111;
        color: #ddd;
        font:
          14px/1.4 system-ui,
          sans-serif;
        margin: 16px;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        border: 1px solid #333;
        cursor: none;
        width: 640px;
        max-width: 100%;
        margin-top: 12px;
      }
      p {
        margin: 6px 0;
      }
      #info:empty {
        display: none;
      }
      #info {
        max-width: 640px;
      }
      label {
        display: block;
        margin-top: 12px;
        max-width: 640px;
      }
    </style>
  </head>
  <body>
    <h1>Jack Orlando Reverse Engineered - minimal embed example</h1>
    <p>
      Load a ZIP of the game's assets and play on the canvas below. Enter the game directory and archive to zip all game
      assets. The exe files are not required.
    </p>
    <label>
      Choose a ZIP
      <input id="zip" type="file" accept=".zip,application/zip" />
    </label>
    <canvas id="screen" width="640" height="480"></canvas>
    <p id="info"></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
