<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jack Orlando</title>
    <style>
      body { background: #111; color: #ddd; font: 14px/1.4 system-ui, sans-serif; margin: 16px; }
      canvas { display: block; image-rendering: pixelated; border: 1px solid #333; cursor: none; width: 640px; max-width: 100%; margin-top: 12px; }
      p { margin: 6px 0; }
      #info:empty { display: none; }
      #info { max-width: 640px; }
      #zip-box { margin-top: 12px; max-width: 640px; }
      #zip-progress progress { display: block; width: 100%; margin-top: 8px; }
      body.start canvas { cursor: default; }
    </style>
  </head>
  <body>
    <h1>Jack Orlando</h1>
    <canvas id="screen" width="640" height="480"></canvas>
    <p id="info" hidden>
      Game files were not found under JO_GAME_DIR. JO_GAME_DIR is an environment
      variable: set it to the folder that contains the game files, then start
      the dev server again. You can also load the game from a ZIP file.
    </p>
    <div id="zip-box" hidden>
      <input id="zip" type="file" accept=".zip,application/zip" />
      <p id="zip-progress" hidden><progress max="100" value="0"></progress> <span></span></p>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
